services:
  - type: web
    name: diet-training-bot
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn chatbot.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHATBOT_DB_PATH
        value: /opt/render/project/src/data/chatbot.db
      - key: PORTAL_INVITE_CODE
        value: ""
